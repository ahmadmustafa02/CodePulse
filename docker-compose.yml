services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - codepulse_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  codepulse_redis_data:
