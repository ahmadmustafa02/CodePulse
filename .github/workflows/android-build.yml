name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "web/**"
      - ".github/workflows/android-build.yml"

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: cd web && npm install --legacy-peer-deps

      - name: Build web
        run: cd web && npm run build

      - name: Sync Capacitor Android
        run: cd web && npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('web/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: cd web/android && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codepulse-android-debug
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
